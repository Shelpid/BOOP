[project]
name = "boop"
version = "0.1.0"
description = "A tiny Solana trading terminal with a pixel mascot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "rich>=13.7", "solders>=0.21", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boop = "boop.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["boop"]
